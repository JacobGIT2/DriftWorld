[project]
name = "driftworld"
version = "0.1.0"
description = "World model training framework comparing VAE, Diffusion, Flow Matching, and Drifting Models for robot manipulation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.25.0",
    "transformers>=4.36.0",
    "timm>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    "torchmetrics>=1.2.0",
    "lpips>=0.1.4",
    "torch-fidelity>=0.3.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "imageio>=2.33.0",
    "imageio-ffmpeg>=0.4.9",
    "safetensors>=0.4.0",
    "accelerate>=0.25.0",
    "pybullet>=3.2.0",
    "calvin-env @ file:///tmp/calvin_repo/calvin_env",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/driftworld"]
sources = ["src"]
